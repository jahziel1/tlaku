[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
homepage = "https://github.com/jahziel1/tlaku"
repository = "https://github.com/jahziel1/tlaku"

# No uses `panic = "abort"` en ningún perfil: tlaku-trace recupera con `catch_unwind` un pánico
# conocido de visioncortex en imágenes con decenas de miles de regiones.

# El nesting es cálculo puro y en debug va ~15 veces más lento: se optimiza también en
# `tauri dev` para que el diálogo responda igual que en la app publicada.
[profile.dev.package.tlaku-nest]
opt-level = 3

[profile.dev.package.i_overlay]
opt-level = 3

# La calibración de lente (Levenberg-Marquardt con matrices densas) y la corrección de imagen son
# cálculo puro: en debug tardan decenas de segundos. Se optimizan también en `tauri dev` y en las
# pruebas.
[profile.dev.package.tlaku-camera]
opt-level = 3
