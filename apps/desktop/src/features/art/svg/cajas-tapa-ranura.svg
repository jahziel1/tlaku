<!--
  Caja sin tapa para corte laser - tapa con ranura
  Dimensiones exteriores de la caja: 63 x 45 x 33 mm (ancho x fondo x alto).
  Grosor de material: 3 mm. Ancho de dedo: 3 mm (rejilla de 3 mm).
  Esta pieza: tapa lisa 63 x 45 mm que se apoya sobre los bordes superiores (lisos) de los paneles. Entalla de dedo de 18 x 6 mm centrada en el borde frontal para levantarla.
  Convencion de dedos: en cada union las celdas de 3 mm se alternan entre ambas piezas;
  los dedos de un panel coinciden con las ranuras del contiguo. Sin holgura de kerf
  (ajustar en el software segun el ancho de corte). Unidades: mm.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64mm" height="46mm" viewBox="0 0 64 46">
  <polygon points="0.5,0.5 23,0.5 23,6.5 41,6.5 41,0.5 63.5,0.5 63.5,45.5 0.5,45.5" fill="none" stroke="#000000" stroke-width="0.2"/>
</svg>
