[package]
name = "tlaku-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Aplicación de escritorio de Tlaku (Tauri v2)"
publish = false

[lib]
name = "tlaku_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` habilita asset://, con el que la interfaz muestra las imágenes del diseño.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tlaku-core = { version = "0.1.0", path = "../../../crates/tlaku-core" }
tlaku-doc = { version = "0.1.0", path = "../../../crates/tlaku-doc" }
tlaku-emu = { version = "0.1.0", path = "../../../crates/tlaku-emu" }
tlaku-grbl = { version = "0.1.0", path = "../../../crates/tlaku-grbl" }
tlaku-i18n = { version = "0.1.0", path = "../../../crates/tlaku-i18n" }
tlaku-pipeline = { version = "0.1.0", path = "../../../crates/tlaku-pipeline" }
# `emu` incluye el emulador UDP con el que funciona la máquina virtual `virtual:ruida`.
tlaku-ruida = { version = "0.1.0", path = "../../../crates/tlaku-ruida", features = ["emu"] }
# `emu` incluye la placa simulada con la que funciona la máquina virtual `virtual:k40`.
tlaku-lhymicro = { version = "0.1.0", path = "../../../crates/tlaku-lhymicro", features = ["emu"] }
# El galvo (tarjetas JCZ/BJJCZ por USB, EXPERIMENTAL): `usb` abre la tarjeta real; el emulador siempre está.
tlaku-galvo = { version = "0.1.0", path = "../../../crates/tlaku-galvo" }
tlaku-text = { version = "0.1.0", path = "../../../crates/tlaku-text" }
tlaku-trace = { version = "0.1.0", path = "../../../crates/tlaku-trace" }
tlaku-camera = { version = "0.1.0", path = "../../../crates/tlaku-camera" }
tlaku-codes = { version = "0.1.0", path = "../../../crates/tlaku-codes" }
tlaku-export = { version = "0.1.0", path = "../../../crates/tlaku-export" }
tlaku-geom = { version = "0.1.0", path = "../../../crates/tlaku-geom" }
tlaku-parts = { version = "0.1.0", path = "../../../crates/tlaku-parts" }
tlaku-nest = { version = "0.1.0", path = "../../../crates/tlaku-nest" }
tlaku-raster = { version = "0.1.0", path = "../../../crates/tlaku-raster" }
base64 = "0.22"
# Catálogo de ajustes de la comunidad (src/community_catalog.rs): un GET a un destino fijo del sitio del
# proyecto. Mismas versiones y funciones que ya trae el actualizador (reqwest 0.13 con rustls y `ring`,
# raíces del sistema), así que no suma dependencias nuevas al árbol; `deny.toml` ya las admite.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Historial de versiones: cada versión se guarda comprimida con gzip (MIT o Apache-2.0; ya la usa tlaku-export).
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# Control remoto desde el celular por la red local (ola 5.5, `src/remote/`). Todas son MIT o Apache-2.0.
# `axum` sirve la página y la API (solo HTTP/1.1, con SSE para los eventos en vivo); `tokio` es el
# motor asíncrono que Tauri ya trae; `getrandom` da la clave aleatoria; `if-addrs` lista las IP de
# la red local para elegir en cuál escuchar.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
getrandom = "0.4"
if-addrs = "0.15"

# Actualizaciones automáticas (ver docs/publicar.md). Sin `pubkey` ni endpoints en tauri.conf.json el
# actualizador no se registra y la interfaz avisa que no está configurado. Ambos son MIT o Apache-2.0.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Abrir en el navegador los formularios de GitHub (MIT o Apache-2.0); alcance limitado en capabilities.
tauri-plugin-opener = "2"
