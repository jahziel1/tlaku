[package]
name = "lasersoft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplicación de escritorio de LaserSoft (Tauri v2)"
publish = false

[lib]
name = "lasersoft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Oleada A: solo la cáscara de la app. Los crates del motor (laser-doc, laser-pipeline...)
# se conectan en la oleada B.
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
