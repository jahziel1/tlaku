[package]
name = "tlaku-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplicación de escritorio de Tlaku (Tauri v2)"
publish = false

[lib]
name = "tlaku_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` habilita asset://, con el que la interfaz muestra las imágenes del diseño.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tlaku-core = { version = "0.1.0", path = "../../../crates/tlaku-core" }
tlaku-doc = { version = "0.1.0", path = "../../../crates/tlaku-doc" }
tlaku-emu = { version = "0.1.0", path = "../../../crates/tlaku-emu" }
tlaku-grbl = { version = "0.1.0", path = "../../../crates/tlaku-grbl" }
tlaku-pipeline = { version = "0.1.0", path = "../../../crates/tlaku-pipeline" }
# `emu` incluye el emulador UDP con el que funciona la máquina virtual `virtual:ruida`.
tlaku-ruida = { version = "0.1.0", path = "../../../crates/tlaku-ruida", features = ["emu"] }
# `emu` incluye la placa simulada con la que funciona la máquina virtual `virtual:k40`.
tlaku-lhymicro = { version = "0.1.0", path = "../../../crates/tlaku-lhymicro", features = ["emu"] }
# El galvo (tarjetas JCZ/BJJCZ por USB, EXPERIMENTAL): `usb` abre la tarjeta real; el emulador siempre está.
tlaku-galvo = { version = "0.1.0", path = "../../../crates/tlaku-galvo" }
tlaku-text = { version = "0.1.0", path = "../../../crates/tlaku-text" }
tlaku-trace = { version = "0.1.0", path = "../../../crates/tlaku-trace" }
tlaku-camera = { version = "0.1.0", path = "../../../crates/tlaku-camera" }
tlaku-codes = { version = "0.1.0", path = "../../../crates/tlaku-codes" }
tlaku-export = { version = "0.1.0", path = "../../../crates/tlaku-export" }
tlaku-geom = { version = "0.1.0", path = "../../../crates/tlaku-geom" }
tlaku-nest = { version = "0.1.0", path = "../../../crates/tlaku-nest" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
