[package]
name = "lasersoft-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aplicación de escritorio de LaserSoft (Tauri v2)"
publish = false

[lib]
name = "lasersoft_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` habilita asset://, con el que la interfaz muestra las imágenes del diseño.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
laser-core = { version = "0.1.0", path = "../../../crates/laser-core" }
laser-doc = { version = "0.1.0", path = "../../../crates/laser-doc" }
laser-grbl = { version = "0.1.0", path = "../../../crates/laser-grbl" }
laser-pipeline = { version = "0.1.0", path = "../../../crates/laser-pipeline" }
