name: Sitio

# Publica `site/` en GitHub Pages al empujar a `main`. INACTIVO hasta que se active a mano:
#   1. Settings > Pages > Source: "GitHub Actions".
#   2. Settings > Secrets and variables > Actions > Variables: crea `PAGES_ENABLED` = `true`.
#   3. Llena `site/config.json` (REPO_URL, SPONSORS_URL, KOFI_URL).
# Sin la variable, el flujo no hace nada (ni falla). Pasos completos en docs/publicar.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-site.mjs"
      - "scripts/site-seo.mjs"
      - "scripts/check-site.mjs"
      - "community/materials/**"
      - "crates/tlaku-doc/**"
      - "apps/desktop/docs/screenshots/**"
      - ".github/workflows/pages.yml"
      # `release-version.mjs after` cambia el cask al publicar cada versión: así el sitio se vuelve a
      # construir y anuncia la versión nueva (GitHub Pages solo despliega desde main, no desde la etiqueta).
      - "packaging/homebrew/Casks/tlaku.rb"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir el sitio
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Copia site/ a site-dist/, trae las capturas de la app y reemplaza los marcadores
      # ({{REPO_URL}}, {{SPONSORS_URL}}, {{KOFI_URL}}) con site/config.json.
      # El sitio anuncia la última Release publicada, no la de tauri.conf.json (que sube antes de
      # publicar). Sin Releases, build-site usa la de tauri.conf.json.
      - name: Versión publicada
        id: publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      - name: Construir
        run: node scripts/build-site.mjs --out site-dist ${{ steps.publicada.outputs.tag && format('--version {0}', steps.publicada.outputs.tag) || '' }}

      # Si hay un enlace roto o un metadato SEO inválido, no se publica nada.
      - name: Revisar el sitio
        run: node scripts/check-site.mjs site-dist

      # Catálogo de ajustes de la comunidad (mejora 5 del plan de usuarios): compila
      # community/materials/*.json al índice `catalog/v1/index.json` con el MISMO validador que aplica la app
      # al descargarlo (esquema, tamaño, entradas, rangos). Si un aporte no pasa, el paso falla y no se
      # publica nada. Sin aportes, el índice sale vacío y la app lo muestra como «aún no hay ajustes».
      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Compilar el catálogo de la comunidad
        run: cargo run --locked -q -p tlaku-doc --example community_catalog -- --out site-dist/catalog/v1/index.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  publicar:
    name: Publicar en Pages
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
