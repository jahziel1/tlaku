name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rust en los tres sistemas: formato, clippy sin avisos y pruebas de todo el espacio de trabajo.
  test:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]  # TEMPORAL fix/windows-ci
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # serialport usa libudev; la app de escritorio (Tauri) compila contra WebKitGTK y GTK.
      - name: Instalar dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev

      # `generate_context!` de Tauri exige que exista la carpeta `frontendDist` (apps/desktop/dist,
      # que no se versiona). Para compilar y probar Rust basta una página vacía; la interfaz real
      # se compila en el trabajo "Interfaz" y en la prueba de humo.
      - name: Carpeta dist de relleno
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Tlaku</title>' > apps/desktop/dist/index.html

      - name: Formato
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Las pruebas de la máquina virtual miden tiempos reales; en los equipos compartidos de la CI
      # (sobre todo Windows y macOS) a veces se atrasan. nextest reintenta hasta 2 veces: un fallo real
      # falla siempre y sigue en rojo; uno de tiempo pasa al reintentar y queda marcado «FLAKY».
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Pruebas
        if: false  # TEMPORAL
        run: cargo nextest run --workspace --all-features --retries 2 --no-fail-fast

      # Sin `tlaku-desktop`: el script de compilación de Tauri deja en Windows un `msvcrt.lib` vacío
      # (para enlazar el runtime de VC estático) y rustdoc lo usa al enlazar las pruebas de otros
      # crates (`LNK2001 __CxxFrameHandler3`). La app no tiene pruebas de documentación.
      - name: TEMPORAL estrés Ruida
        continue-on-error: true
        run: cargo nextest run -p tlaku-desktop --all-features -E "test(/ruida/)" --stress-count 25 --retries 0 --no-fail-fast

      - name: Pruebas de documentación
        if: false  # TEMPORAL
        run: cargo test --workspace --exclude tlaku-desktop --all-features --doc

  # Licencias y orígenes de las dependencias (deny.toml).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses sources

  # Interfaz (React + TypeScript): tipos, lint, pruebas y la tabla de atajos del README.
  interfaz:
    name: Interfaz (tsc, eslint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos (tsc)
        run: npx tsc --noEmit

      - name: Lint (eslint)
        run: npx eslint .

      - name: Pruebas (vitest)
        run: npx vitest run

      # La tabla de atajos del README sale del registro de comandos; si falla, `npm run readme`.
      - name: Tabla de atajos del README
        run: npx vitest run src/features/shell/readme.test.ts

  # La app Tauri real arranca y responde a los comandos de solo lectura (ventana oculta, bajo Xvfb).
  humo:
    name: Prueba de humo de la app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Instalar dependencias de Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      # La interfaz real se empaqueta dentro de la app (apps/desktop/dist).
      - name: Compilar la interfaz
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build:tauri

      # Sin $DISPLAY el propio script se relanza con xvfb-run.
      - name: Prueba de humo
        run: bash apps/desktop/scripts/smoke-tauri.sh

  # El sitio se construye sin errores (marcadores válidos y capturas presentes).
  sitio:
    name: Sitio estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Construir site/
        run: node scripts/build-site.mjs --out "$RUNNER_TEMP/site-dist"
