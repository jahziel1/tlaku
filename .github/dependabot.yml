# Actualizaciones semanales de dependencias, agrupadas para no saturar de PRs.
# Weekly dependency updates, grouped to avoid a flood of PRs.
# Las licencias las revisa `cargo deny` en la CI; una actualización con una licencia no permitida falla ahí.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Los tipos de Node deben coincidir con la versión de Node que usamos (24, en la CI y en
      # `engines`); un salto mayor de @types/node no aplica hasta cambiar de Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Su etiqueta es la versión de Rust y va fija junto con rust-toolchain.toml: se actualiza a mano.
      - dependency-name: "dtolnay/rust-toolchain"
