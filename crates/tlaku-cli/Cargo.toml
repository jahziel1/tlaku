[package]
name = "tlaku-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
tlaku-core = { version = "0.1.0", path = "../tlaku-core" }
tlaku-dxf = { version = "0.1.0", path = "../tlaku-dxf" }
tlaku-fill = { version = "0.1.0", path = "../tlaku-fill" }
tlaku-galvo = { version = "0.1.0", path = "../tlaku-galvo" }
tlaku-geom = { version = "0.1.0", path = "../tlaku-geom" }
tlaku-grbl = { version = "0.1.0", path = "../tlaku-grbl" }
tlaku-i18n = { version = "0.1.0", path = "../tlaku-i18n" }
tlaku-lhymicro = { version = "0.1.0", path = "../tlaku-lhymicro", features = ["emu"] }
tlaku-pipeline = { version = "0.1.0", path = "../tlaku-pipeline" }
tlaku-plan = { version = "0.1.0", path = "../tlaku-plan" }
tlaku-raster = { version = "0.1.0", path = "../tlaku-raster" }
tlaku-ruida = { version = "0.1.0", path = "../tlaku-ruida" }
tlaku-sim = { version = "0.1.0", path = "../tlaku-sim" }
tlaku-svg = { version = "0.1.0", path = "../tlaku-svg" }

[dev-dependencies]
# El emulador de controladora Ruida (UDP en localhost) es solo para pruebas.
tlaku-ruida = { version = "0.1.0", path = "../tlaku-ruida", features = ["emu"] }

[lib]
name = "tlaku_cli"
path = "src/lib.rs"

[[bin]]
name = "tlaku"
path = "src/main.rs"
