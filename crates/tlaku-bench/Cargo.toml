[package]
name = "tlaku-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prueba de estrés del motor con archivos reales: tiempo, memoria y emulador GRBL por archivo"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tlaku-core = { version = "0.1.0", path = "../tlaku-core" }
tlaku-doc = { version = "0.1.0", path = "../tlaku-doc" }
tlaku-emu = { version = "0.1.0", path = "../tlaku-emu" }
tlaku-grbl = { version = "0.1.0", path = "../tlaku-grbl" }
tlaku-pipeline = { version = "0.1.0", path = "../tlaku-pipeline" }
