[package]
name = "laser-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
laser-core = { version = "0.1.0", path = "../laser-core" }
laser-dxf = { version = "0.1.0", path = "../laser-dxf" }
laser-fill = { version = "0.1.0", path = "../laser-fill" }
laser-geom = { version = "0.1.0", path = "../laser-geom" }
laser-grbl = { version = "0.1.0", path = "../laser-grbl" }
laser-plan = { version = "0.1.0", path = "../laser-plan" }
laser-raster = { version = "0.1.0", path = "../laser-raster" }
laser-sim = { version = "0.1.0", path = "../laser-sim" }
laser-svg = { version = "0.1.0", path = "../laser-svg" }

[lib]
name = "laser_cli"
path = "src/lib.rs"

[[bin]]
name = "lasersoft"
path = "src/main.rs"
