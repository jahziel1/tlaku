[package]
name = "tlaku-emu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Emulador de controladoras láser (GRBL, Falcon2, grblHAL, FluidNC...) para probar sin máquina física"

[dependencies]
tlaku-grbl = { version = "0.1.0", path = "../tlaku-grbl" }

[dev-dependencies]
tlaku-core = { version = "0.1.0", path = "../tlaku-core" }
tlaku-doc = { version = "0.1.0", path = "../tlaku-doc" }
tlaku-pipeline = { version = "0.1.0", path = "../tlaku-pipeline" }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
