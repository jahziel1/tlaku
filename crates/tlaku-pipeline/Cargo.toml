[package]
name = "tlaku-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tlaku-core = { version = "0.1.0", path = "../tlaku-core" }
tlaku-doc = { version = "0.1.0", path = "../tlaku-doc" }
tlaku-dxf = { version = "0.1.0", path = "../tlaku-dxf" }
tlaku-fill = { version = "0.1.0", path = "../tlaku-fill" }
tlaku-geom = { version = "0.1.0", path = "../tlaku-geom" }
tlaku-grbl = { version = "0.1.0", path = "../tlaku-grbl" }
tlaku-lbrn = { version = "0.1.0", path = "../tlaku-lbrn" }
tlaku-plan = { version = "0.1.0", path = "../tlaku-plan" }
tlaku-raster = { version = "0.1.0", path = "../tlaku-raster" }
tlaku-sim = { version = "0.1.0", path = "../tlaku-sim" }
tlaku-svg = { version = "0.1.0", path = "../tlaku-svg" }
serde = { version = "1.0.229", features = ["derive"] }
tlaku-text = { version = "0.1.0", path = "../tlaku-text" }
tlaku-trace = { version = "0.1.0", path = "../tlaku-trace" }
lopdf = { version = "0.45", default-features = false }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "bmp", "webp", "tiff", "gif", "tga"] }
